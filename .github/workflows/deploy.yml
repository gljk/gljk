name: deploy

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true
    - name: Install deps
      run: |
        # jekyll-imagemagick shells out to `convert`, which is not present on
        # the ubuntu-latest runner. Without it the plugin logs an error, exits
        # 127, generates nothing, and every <source srcset> on the site 404s.
        sudo apt-get update
        sudo apt-get install -y imagemagick
        npm install -g mermaid.cli
    - name: Verify ImageMagick can write WebP
      # The gem swallows convert failures, so a missing binary or missing webp
      # delegate degrades silently. Fail loudly here instead.
      run: |
        convert -size 8x8 xc:red /tmp/imcheck.webp
        test -s /tmp/imcheck.webp
        echo "ImageMagick WebP encoding OK"
    - name: Setup deploy options
      id: setup
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        if [[ ${GITHUB_REF} = refs/pull/*/merge ]]; then # pull request
          echo "SRC_BRANCH=${GITHUB_HEAD_REF}" >> "$GITHUB_OUTPUT"
          echo "NO_PUSH=--no-push" >> "$GITHUB_OUTPUT"
        elif [[ ${GITHUB_REF} = refs/heads/* ]]; then # branch, e.g. master, source etc
          echo "SRC_BRANCH=${GITHUB_REF#refs/heads/}" >> "$GITHUB_OUTPUT"
        fi
        echo "DEPLOY_BRANCH=gh-pages" >> "$GITHUB_OUTPUT"
    - name: Deploy website
      run:  yes | bash bin/deploy --verbose ${{ steps.setup.outputs.NO_PUSH }}
                    --src ${{ steps.setup.outputs.SRC_BRANCH }}
                    --deploy ${{ steps.setup.outputs.DEPLOY_BRANCH }}
